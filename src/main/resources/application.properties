spring.application.name=quantity-measurement-app
# Application Configuration Properties
server.port=8080

# H2 Database (In-Memory for Development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:quantitymeasurementdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ✅ ADD THIS LINE
# JWT Configuration
jwt.secret=your-secret-key-here-make-it-long-and-secure-at-least-256-bits
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000


spring.security.oauth2.client.registration.github.client-id=Ov23liMJeha2MUbFijd9
spring.security.oauth2.client.registration.github.client-secret=1ac95e1a0f4786becc62e89125264917feba3b3f
spring.security.oauth2.client.registration.github.scope=read:user,user:email
# Add this line - it's critical!
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/login/oauth2/code/github


# Server

server.error.include-message=always
server.error.include-binding-errors=always

# CORS is handled in SecurityConfig

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS Configuration - Allow frontend
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

